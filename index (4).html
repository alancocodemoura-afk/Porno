<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>JARVIS AI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--cy:#00e5ff;--cy-d:rgba(0,229,255,.14);--bg:#000;--pn:#071017;--pn2:#0b1a24;--bd:rgba(0,229,255,.24);--tx:#fff;--mu:#8fb3bd;--er:#ff5470;--ok:#3dffa8;--mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:15px/1.5 system-ui,Roboto,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--cy)}
button:active{background:var(--cy-d)}
button.pri{background:var(--cy);color:#001418;border-color:var(--cy);font-weight:600}
button.dng{color:var(--er);border-color:rgba(255,84,112,.4)}
button:disabled{opacity:.35;pointer-events:none}
input,select,textarea{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy-d)}
input[type=checkbox]{width:auto}
textarea{resize:none}
h3,h4{margin:.6em 0 .3em;font-weight:600}
a{color:var(--cy)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bd);min-height:50px}
.brand b{font-family:var(--mono);letter-spacing:.18em;font-size:16px;text-shadow:0 0 12px rgba(0,229,255,.7)}
.sub{display:block;font-family:var(--mono);font-size:11px;color:var(--mu)}
.sub i{font-style:normal;color:var(--cy)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--mono);font-size:10px;border:1px solid var(--bd);border-radius:20px;padding:2px 8px;color:var(--mu)}
.chip.ok{color:var(--ok);border-color:rgba(61,255,168,.4)}
main{flex:1;min-height:0;position:relative}
.view{display:none;position:absolute;inset:0;overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
.view.on{display:block}
.orbwrap{height:min(46vh,340px);position:relative}
#orb{width:100%;height:100%;display:block}
.hello{text-align:center;font-family:var(--mono);font-size:14px;color:var(--cy);margin:2px 0 10px;min-height:22px}
.reply{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;max-height:30vh;overflow-y:auto;font-size:14px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.quick button{font-size:13px;border-radius:20px}
#msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.m{max-width:92%;padding:10px 13px;border-radius:14px;word-wrap:break-word;overflow-wrap:anywhere;font-size:14.5px}
.m.u{align-self:flex-end;background:var(--cy-d);border:1px solid var(--bd)}
.m.a{align-self:flex-start;background:var(--pn);border:1px solid rgba(255,255,255,.08)}
.m.err{border-color:rgba(255,84,112,.5)}
.m .tag{font-family:var(--mono);font-size:10px;color:var(--mu);display:block;margin-bottom:3px}
.m .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.m .acts button{font-size:12px;padding:4px 9px;color:var(--mu)}
.m .src{font-size:12px;color:var(--mu);margin-top:6px}
.m li{margin-left:18px;list-style:disc}
.code{margin:8px 0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#02080c}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:var(--pn2);font-family:var(--mono);font-size:11px;color:var(--mu)}
.code .ch button{padding:2px 8px;font-size:11px}
.code pre{margin:0;padding:10px;overflow-x:auto;font:12.5px/1.45 var(--mono);white-space:pre}
code{font-family:var(--mono);background:var(--pn2);padding:1px 5px;border-radius:5px;font-size:.92em}
.bar2{display:flex;gap:8px;margin-bottom:10px}
.bar2 select{flex:1}
#composer{padding:8px 12px 6px;border-top:1px solid var(--bd);background:#000}
#composer .row{display:flex;gap:6px;align-items:flex-end}
#composer .row2{display:flex;gap:10px;align-items:center;margin-top:5px;font-size:12px;color:var(--mu);flex-wrap:wrap}
#composer .row2 select{width:auto;padding:3px 6px;font-size:12px}
#composer .row2 label{display:flex;gap:5px;align-items:center}
.lnk{border:none;padding:2px 4px;color:var(--mu);font-size:12px}
.ib{width:42px;height:42px;padding:0;display:grid;place-items:center;flex:none;border-radius:50%}
.ib svg{width:20px;height:20px}
.ib.live{background:var(--cy);color:#001418;animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px rgba(0,229,255,.18)}}
.talk{flex:1;height:42px;border-radius:22px}
#attChip{font-size:12px;color:var(--cy);margin-bottom:5px;font-family:var(--mono)}
nav{display:flex;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);background:#000}
nav button{flex:1;border:none;border-radius:0;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);font-family:var(--mono)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--cy);text-shadow:0 0 8px rgba(0,229,255,.6)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left;color:var(--tx);display:block;width:100%}
.card b{display:block;margin-bottom:2px}
.card span{font-size:12px;color:var(--mu)}
.card .gl{font-family:var(--mono);color:var(--cy);font-size:18px;display:block;margin-bottom:4px}
#sheet{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 50px);bottom:calc(57px + env(safe-area-inset-bottom));background:#000;z-index:20;display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bd)}
#sheet .sh b{flex:1}
#sheetBody{flex:1;overflow-y:auto;padding:12px 16px 24px}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}.row>.f{flex:1 1 140px}
label.l{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-family:var(--mono)}
.muted{color:var(--mu);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mu)}
details{background:var(--pn);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}
details>summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";float:right;color:var(--cy)}
details[open]>summary::after{content:"–"}
details>.in{padding:0 14px 14px}
pre.live{background:#02080c;border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:240px;overflow:auto;white-space:pre-wrap;font:12.5px/1.45 var(--mono);margin:8px 0}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--cy)}
.badge.er{color:var(--er);border-color:rgba(255,84,112,.5)}
.badge.ok{color:var(--ok);border-color:rgba(61,255,168,.5)}
.bigbar{height:6px;background:var(--pn2);border-radius:4px;overflow:hidden;margin:6px 0}
.bigbar i{display:block;height:100%;background:var(--cy);width:0}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#06222b;border:1px solid var(--cy);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:60;display:grid;place-items:center;padding:20px}
#dlg[hidden]{display:none}
#dlg .box{width:100%;max-width:420px;margin:0}
#dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{width:100%;border-radius:10px;display:block}
body.lp *{animation:none!important;transition:none!important;text-shadow:none!important;box-shadow:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>JARVIS AI</b><span class="sub">ESTADO: <i id="stateTxt">EN LÍNEA</i></span></div>
  <div class="chips"><span id="chipAI" class="chip">IA: sin clave</span><span id="chipLP" class="chip" hidden>BAJO CONSUMO</span></div>
</header>

<main>
  <section id="v-home" class="view on">
    <div class="orbwrap"><canvas id="orb" aria-label="Esfera holográfica de JARVIS"></canvas></div>
    <div id="hello" class="hello">Estoy listo. ¿En qué puedo ayudarte?</div>
    <div id="lastReply" class="reply" hidden></div>
    <div id="setupBanner" class="box" hidden>
      <b>Falta conectar una IA</b>
      <p class="muted">Para conversar necesitas una clave de API gratuita de un proveedor (Gemini, Groq u OpenRouter). Tarda un par de minutos.</p>
      <button class="pri" id="bSetup">Configurar IA</button>
    </div>
    <div class="quick" id="quick"></div>
  </section>

  <section id="v-chat" class="view">
    <div class="bar2"><select id="chatSel" aria-label="Conversaciones"></select><button id="bNewChat">Nueva</button><button id="bDelChat" class="dng">Borrar</button></div>
    <div id="msgs"></div>
  </section>

  <section id="v-tools" class="view"><div id="toolGrid" class="grid"></div></section>
  <section id="v-sys" class="view"><div id="sysBody"></div></section>
</main>

<div id="sheet" hidden>
  <div class="sh"><button id="sheetBack">← Volver</button><b id="sheetTitle"></b></div>
  <div id="sheetBody"></div>
</div>

<div id="composer">
  <div id="attChip" hidden></div>
  <div class="row">
    <button id="bMode" class="ib" title="Cambiar entre escribir y hablar" aria-label="Cambiar entre escribir y hablar"></button>
    <textarea id="inp" rows="1" placeholder="Escribe a JARVIS…" aria-label="Mensaje"></textarea>
    <button id="bTalk" class="talk" hidden>Toca para hablar</button>
    <button id="bMic" class="ib" title="Dictar por voz" aria-label="Dictar por voz"></button>
    <button id="bSend" class="ib pri" title="Enviar" aria-label="Enviar"></button>
  </div>
  <div class="row2">
    <select id="selExt" aria-label="Extensión de la respuesta"><option value="breve">Breve</option><option value="detallado">Detallado</option><option value="extenso">Extenso</option><option value="maxima">Máxima extensión</option></select>
    <label><input type="checkbox" id="tSearch"> Búsqueda web</label>
    <button id="bStopVoice" class="lnk">Detener voz</button>
  </div>
</div>

<nav>
  <button data-tab="home" class="on"></button>
  <button data-tab="chat"></button>
  <button data-tab="tools"></button>
  <button data-tab="sys"></button>
</nav>

<div id="toast"></div>
<div id="dlg" hidden></div>

<script>
'use strict';
/* =====================================================================
   JARVIS AI — PWA de un solo archivo. Sin dependencias externas.
   Secciones: utilidades · DB · claves · proveedores IA · chat · voz ·
   esfera · proyectos largos · herramientas · sistema · arranque
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sleep=(ms,sig)=>new Promise((res,rej)=>{const t=setTimeout(res,ms);if(sig)sig.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('abort','AbortError'))},{once:true})});
const ICON={
 home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
 chat:'M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z',
 tools:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
 sys:'M7 7h10v10H7zM9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4',
 mic:'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3',
 send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',
 stop:'M6 6h12v12H6z',
 kb:'M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M7 14h10'
};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[n]}"/></svg>`;
let toastT;function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
function modal({title,body='',input=null,okText='Aceptar',cancelText='Cancelar'}){return new Promise(res=>{const d=$('#dlg');d.hidden=false;d.innerHTML=`<div class="box"><h3>${esc(title)}</h3><div class="muted">${body}</div>${input?`<input id="dIn" type="${input}" autocomplete="off" style="margin-top:10px">`:''}<div class="btns">${cancelText?`<button id="dNo">${cancelText}</button>`:''}<button id="dOk" class="pri">${okText}</button></div></div>`;const done=v=>{d.hidden=true;d.innerHTML='';res(v)};$('#dOk').onclick=()=>done(input?$('#dIn').value:true);if($('#dNo'))$('#dNo').onclick=()=>done(input?null:false);const i=$('#dIn');if(i)i.focus()})}
const confirmBox=(t,b)=>modal({title:t,body:b,okText:'Confirmar'});
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copiado');return true}catch{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();toast(ok?'Copiado':'No se pudo copiar');return ok}}
function download(name,parts,type='text/plain'){const b=new Blob(parts,{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const slug=s=>(s||'documento').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'documento';
const fmtN=n=>new Intl.NumberFormat('es').format(n);

/* ---------- Ajustes ---------- */
const DEF={provider:'gemini',models:{gemini:'gemini-3.1-flash-lite',groq:'llama-3.3-70b-versatile',openrouter:'meta-llama/llama-3.3-70b-instruct:free',custom:'',pollinations:''},baseUrls:{groq:'https://api.groq.com/openai/v1',openrouter:'https://openrouter.ai/api/v1',custom:''},speak:'voice',voiceURI:'',rate:1,lang:'es-ES',lowPower:'auto',ext:'detallado',maxParts:40,wake:true,history:true,memoryOn:true,search:false,autoCont:true,inputMode:'text',confirmOpen:false};
let S=Object.assign({},DEF);
try{const o=JSON.parse(localStorage.getItem('jv_s')||'{}');S=Object.assign({},DEF,o,{models:Object.assign({},DEF.models,o.models),baseUrls:Object.assign({},DEF.baseUrls,o.baseUrls)})}catch{}
const saveS=()=>localStorage.setItem('jv_s',JSON.stringify(S));
const PROV={gemini:{n:'Google Gemini (AI Studio)',help:'aistudio.google.com/apikey'},groq:{n:'Groq (compatible OpenAI)',help:'console.groq.com/keys'},openrouter:{n:'OpenRouter (modelos :free)',help:'openrouter.ai/keys'},custom:{n:'Otro compatible con OpenAI',help:'la que indique tu proveedor'}};

/* ---------- Base de datos local (IndexedDB) ---------- */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('jarvis',1);r.onupgradeneeded=()=>{['chats','notes','projects','kv'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}))};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 st(s,m='readonly'){return this.db.transaction(s,m).objectStore(s)},
 get(s,id){return this.rq(this.st(s).get(id))},
 put(s,v){return this.rq(this.st(s,'readwrite').put(v))},
 del(s,id){return this.rq(this.st(s,'readwrite').delete(id))},
 all(s){return this.rq(this.st(s).getAll())},
 clear(s){return this.rq(this.st(s,'readwrite').clear())},
 keys(s){return this.rq(this.st(s).getAllKeys())}
};

/* ---------- Claves de API (cifradas con PIN: PBKDF2 + AES-GCM) ---------- */
const KEYS={};
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dkey(pin,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function storeKey(p,key,pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await dkey(pin,salt);const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(key));localStorage.setItem('jv_k_'+p,JSON.stringify({s:b64(salt),i:b64(iv),c:b64(c)}))}
async function unlockKeys(pin){let ok=0;for(const p of Object.keys(DEF.models)){const r=localStorage.getItem('jv_k_'+p);if(!r)continue;try{const o=JSON.parse(r);const k=await dkey(pin,unb64(o.s));const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},k,unb64(o.c));KEYS[p]=dec.decode(d);ok++}catch{}}return ok}
const storedKeys=()=>Object.keys(DEF.models).filter(p=>localStorage.getItem('jv_k_'+p));

/* ---------- Capa de proveedores de IA (intercambiable) ---------- */
class ApiError extends Error{constructor(m,status,net){super(m);this.status=status||0;this.isNet=!!net}}
async function readSSE(res,onData){const rd=res.body.getReader();const d=new TextDecoder();let buf='';for(;;){const {done,value}=await rd.read();if(done)break;buf+=d.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line.startsWith('data:')){const x=line.slice(5).trim();if(x)onData(x)}}}}
async function httpErr(res){let m='';try{const j=await res.json();m=(j.error&&(j.error.message||JSON.stringify(j.error)))||JSON.stringify(j)}catch{try{m=await res.text()}catch{}}
 const h=res.status===429?' (cuota o límite de velocidad alcanzado: espera o cambia de proveedor/modelo)':(res.status===401||res.status===403)?' (clave inválida o sin permiso)':res.status===404?' (modelo no encontrado: revisa su nombre en Ajustes)':'';
 return new ApiError(`HTTP ${res.status}${h}: ${String(m).slice(0,280)}`,res.status)}
/* Contrato común: llm({system,messages:[{role,text}],maxTokens,signal,onText,onSources,noThink,search}) -> {finish:'stop'|'length'|otro} */
async function llm({system,messages,maxTokens=2048,signal,onText,onSources,noThink=false,search=false}){
 const p=S.provider,key=KEYS[p],model=S.models[p];
 if(!key)throw new ApiError('Falta la clave de API. Ve a Sistema → Ajustes de IA.');
 if(!model)throw new ApiError('Falta el nombre del modelo en Ajustes de IA.');
 if(!navigator.onLine)throw new ApiError('Sin conexión a Internet.',0,true);
 let finish='stop';
 try{
  let res;
  if(p==='gemini'){
   const body={systemInstruction:{parts:[{text:system}]},contents:messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]})),generationConfig:{maxOutputTokens:maxTokens,temperature:.8}};
   if(noThink&&/2\.5-flash/.test(model))body.generationConfig.thinkingConfig={thinkingBudget:0};
   if(search)body.tools=[{google_search:{}}];
   res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal});
   if(!res.ok)throw await httpErr(res);
   await readSSE(res,d=>{let j;try{j=JSON.parse(d)}catch{return}const c=j.candidates&&j.candidates[0];if(!c)return;
    const t=((c.content&&c.content.parts)||[]).map(x=>x.text||'').join('');if(t&&onText)onText(t);
    if(c.finishReason)finish=c.finishReason==='MAX_TOKENS'?'length':String(c.finishReason).toLowerCase();
    const g=c.groundingMetadata&&c.groundingMetadata.groundingChunks;if(g&&onSources)onSources(g.filter(x=>x.web).map(x=>({title:x.web.title,uri:x.web.uri})))});

async function send(raw,{voice=false,extra='',preset=''}={}){

async function respond({voice=false,cont=false}={}){

  for(;;){
   const r=await llm({system:sysPrompt(),messages:ctxMessages(m,!!m.text),maxTokens:TOK[S.ext],signal:CTRL.signal,search:S.search&&S.provider==='gemini',

/* ---------- Calculadora (local, sin IA) ---------- */
function calcEval(src){
 const s=src.toLowerCase().replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/,/g,'.').replace(/\*\*/g,'^');
 let i=0;
 const F={sqrt:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,log:Math.log10,ln:Math.log,abs:Math.abs,round:Math.round,floor:Math.floor,ceil:Math.ceil,exp:Math.exp};
 const C={pi:Math.PI,e:Math.E};
 const fact=n=>{if(n<0||n>170||n%1)throw Error('factorial inválido');let r=1;for(let k=2;k<=n;k++)r*=k;return r};
 function expr(){let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
 function term(){let v=un();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const r=un();v=o==='*'?v*r:v/r}return v}
 function un(){if(s[i]==='-'){i++;return -un()}if(s[i]==='+'){i++;return un()}return pow()}
 function pow(){const b=post();if(s[i]==='^'){i++;return Math.pow(b,un())}return b}
 function post(){let v=prim();for(;;){if(s[i]==='%'){i++;v/=100}else if(s[i]==='!'){i++;v=fact(v)}else break}return v}
 function prim(){
  if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw Error('Falta )');i++;return v}
  let m=s.slice(i).match(/^\d*\.?\d+(?:e[+-]?\d+)?/);if(m){i+=m[0].length;return parseFloat(m[0])}
  m=s.slice(i).match(/^[a-z]+/);if(m){i+=m[0].length;const n=m[0];if(F[n]){if(s[i]!=='(')throw Error('Falta (');i++;const v=expr();if(s[i]!==')')throw Error('Falta )');i++;return F[n](v)}if(n in C)return C[n];throw Error('Desconocido: '+n)}
  throw Error('Expresión no válida');
 }
 const r=expr();if(i<s.length)throw Error('Expresión no válida');if(!isFinite(r))throw Error('Resultado no finito');
 return Number(r.toPrecision(12));
}

/* ---------- Búsqueda web (Wikipedia en español; Google en Gemini) ---------- */
async function wiki(q){const u=`https://es.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exchars=900&format=json&origin=*`;const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();return Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).map(p=>({title:p.title,url:p.fullurl,text:p.extract||''}))}
const wikiCtx=r=>`Resultados de búsqueda (Wikipedia en español, consultados ahora; no son noticias en tiempo real). Úsalos si ayudan, cita la fuente y di si no bastan:\n`+r.map((x,i)=>`${i+1}. ${x.title}: ${x.text}\n   ${x.url}`).join('\n');

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SR){toast('Este navegador no soporta reconocimiento de voz. Usa Chrome.',4000);return}

 let final='',gotAny=false;
 r.onstart=()=>setState('listening');
 r.onresult=e=>{gotAny=true;let t='';for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)final=t}$('#inp').value=t;autosize();Orb.pulse()};
 r.onerror=e=>{const M={'not-allowed':'Permiso de micrófono denegado. Actívalo en Chrome → Configuración del sitio → Micrófono.','service-not-allowed':'El reconocimiento de voz no está permitido en este contexto.','no-speech':'No te escuché. Inténtalo de nuevo.','audio-capture':'No se detecta micrófono.','network':'El reconocimiento de voz necesita Internet.','aborted':''};const m=e.error in M?M[e.error]:'Error de voz: '+e.error;if(m)toast(m,4500)};
 r.onend=()=>{REC=null;if(STATE==='listening')setState('idle');const t=(final||'').trim();if(t)send(t,{voice:true});else if(gotAny&&$('#inp').value.trim())toast('Revisa el texto y pulsa enviar.')};

}
function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>x.voiceURI===S.voiceURI)||v.find(x=>x.lang===S.lang)||v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('es'))||null}
function speak(text){
 if(!('speechSynthesis'in window)){setState('idle');return}
 speechSynthesis.cancel();const id=++SPK;
 let clean=String(text).replace(/```[\s\S]*?```/g,' (bloque de código omitido). ').replace(/https?:\/\/\S+/g,' enlace ').replace(/[*_#`>|]/g,'').replace(/\s+/g,' ').trim();
 if(clean.length>2500){clean=clean.slice(0,2500);toast('Leo solo los primeros 2500 caracteres; el resto está en pantalla.',4000)}
 const sents=clean.match(/[^.!?;:]+[.!?;:]*/g)||[clean];const chunks=[];let cur='';
 for(const s of sents){if((cur+s).length>180&&cur){chunks.push(cur);cur=s}else cur+=s}if(cur)chunks.push(cur);
 if(!chunks.length){setState('idle');return}
 setState('speaking');const v=pickVoice();
 chunks.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.lang=S.lang;u.rate=+S.rate||1;if(v)u.voice=v;u.onboundary=()=>Orb.pulse();u.onstart=()=>Orb.pulse();
  u.onend=()=>{if(id===SPK&&i===chunks.length-1)setState('idle')};u.onerror=()=>{if(id===SPK&&i===chunks.length-1)setState('idle')};speechSynthesis.speak(u)});
}
function stopSpeak(){SPK++;try{speechSynthesis.cancel()}catch{}if(STATE==='speaking')setState('idle')}

/* ---------- Esfera holográfica (canvas, reacciona al estado real) ---------- */
const Orb=(()=>{
 const cv=$('#orb'),cx=cv.getContext('2d');let W=0,H=0,pts=[],N=0,t=0,pls=0,last=0,slow=0;
 function build(n){N=n;pts=[];const g=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),a=g*i;pts.push([Math.cos(a)*r,y,Math.sin(a)*r,Math.random()])}}
 function size(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
 function frame(ts){
  requestAnimationFrame(frame);
  if(document.hidden||!W||!H||!$('#v-home').classList.contains('on'))return;
  const lp=lowP(),fps=lp?15:30;if(ts-last<1000/fps-3)return;
  const dt=Math.min(ts-last,100);last=ts;
  if(!lp&&dt>46){if(++slow>40&&N>160){build(Math.floor(N*.7));slow=0}}else slow=Math.max(0,slow-1);
  const want=lp?170:420;if(lp&&N>want)build(want);else if(!lp&&N<want&&slow===0&&dt<40&&N===170)build(want);
  t+=dt/1000;pls*=.9;const st=STATE;
  const spin=st==='processing'?1.5:st==='listening'?.55:st==='speaking'?.5:.22;
  let amp=1+.02*Math.sin(t*1.3);
  if(st==='listening')amp=1+.05*Math.sin(t*5)+.06*pls;
  else if(st==='processing')amp=1+.03*Math.sin(t*9);
  else if(st==='speaking')amp=1+.1*pls;
  cx.clearRect(0,0,W,H);
  const R=Math.min(W,H)*.34,X=W/2,Y=H/2;
  if(!lp){const g=cx.createRadialGradient(X,Y,R*.15,X,Y,R*1.55);g.addColorStop(0,`rgba(0,229,255,${.12+.08*pls+(st==='idle'?0:.05)})`);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}
  const ay=t*spin,ax=.35,cy_=Math.cos(ay),sy=Math.sin(ay),cxx=Math.cos(ax),sx=Math.sin(ax);
  cx.fillStyle='#00e5ff';
  for(let k=0;k<N;k++){const p=pts[k];let x=p[0]*cy_+p[2]*sy,z=-p[0]*sy+p[2]*cy_,y=p[1]*cxx-z*sx;z=p[1]*sx+z*cxx;
   let d=1;if(st==='processing')d=1+.09*Math.sin(t*5+p[3]*25);else if(st==='speaking')d=1+.12*pls*Math.sin(p[3]*30+t*9);
   const sc=3/(3-z*.9),px=X+x*R*amp*d*sc,py=Y+y*R*amp*d*sc,dep=(z+1)/2;
   cx.globalAlpha=.18+.82*dep;const s=(lp?1.6:1.2)+1.5*dep;cx.fillRect(px-s/2,py-s/2,s,s)}
  cx.globalAlpha=1;cx.lineWidth=1.2;cx.strokeStyle='#00e5ff';
  if(st==='listening'){const q=(t*1.1)%1;cx.globalAlpha=1-q;cx.beginPath();cx.arc(X,Y,R*(1.08+.3*q),0,6.283);cx.stroke()}
  else if(st==='processing'){cx.globalAlpha=.8;cx.beginPath();cx.arc(X,Y,R*1.18,t*3,t*3+1.7);cx.stroke();cx.beginPath();cx.arc(X,Y,R*1.18,t*3+3.14,t*3+4.84);cx.stroke()}
  else if(st==='speaking'){cx.globalAlpha=.25+.5*pls;cx.beginPath();cx.arc(X,Y,R*(1.1+.12*pls),0,6.283);cx.stroke()}

const Run={active:false,pause:false,stop:false,ctrl:null,wait:'',live:'',lock:null};
const segKey=(pid,n)=>`seg:${pid}:${String(n).padStart(6,'0')}`;
const TOKP={breve:1200,detallado:2500,extenso:4096,maxima:8192};
const FH=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};

async function newProject({title,kind,brief,mode,target}){const p={id:uid(),title:title||brief.slice(0,40),kind,brief,mode,target,outline:'',sums:[],segCount:0,chars:0,words:0,tail:'',trunc:false,seen:[],files:[],status:'new',lastError:'',created:Date.now(),updated:Date.now()};await DB.put('projects',p);return p}
function projSystem(p){return `Eres JARVIS AI trabajando en un proyecto de generación larga por partes. Produce ÚNICAMENTE el contenido de la obra: sin saludos, sin comentarios sobre lo que haces, sin preguntas al usuario. Mantén coherencia absoluta con el esquema, los nombres, el estilo y lo ya escrito. Nunca repitas texto previo. Escribe en español salvo que la instrucción indique otro idioma.`
 +(p.kind==='code'?` Estás creando un programa: organiza TODO por archivos. Cada archivo empieza con una línea exacta "### ARCHIVO: ruta/nombre.ext" seguida de un bloque de código con fence de tres acentos graves y el contenido COMPLETO del archivo. Nunca uses "..." ni "// resto del código". Si un archivo queda cortado por el límite, en la siguiente petición continuarás exactamente desde ese punto dentro del mismo bloque.`:'')
 +` Al terminar cada parte (si NO te cortó el límite), añade en una línea nueva [[RESUMEN: una frase con lo cubierto y lo que sigue]]. Si TODA la obra queda completa, añade después, en otra línea, [[FIN]].`}
function segPrompt(p,cont,n){
 const sums=p.sums.slice(-10).map(s=>`- Parte ${s.n}: ${s.t}`).join('\n')||'(aún no hay partes)';
 let t=`PROYECTO: ${p.title}\nTIPO: ${p.kind==='code'?'programa de software (por archivos)':p.kind==='doc'?'documento':'texto/narrativa'}\n\nINSTRUCCIÓN ORIGINAL DEL USUARIO:\n${p.brief}\n\nOBJETIVO/EXTENSIÓN: ${p.target||'la que el proyecto requiera'}\n\nESQUEMA Y DECISIONES (memoria del proyecto):\n${(p.outline||'(sin esquema)').slice(0,5000)}\n\nPROGRESO:\n${sums}\n`;
 if(p.tail)t+=`\nÚLTIMO FRAGMENTO YA ESCRITO (solo para continuidad; NO lo repitas):\n"""\n${p.tail}\n"""\n`;
 t+=cont?`\nTAREA: el fragmento anterior quedó cortado por el límite de longitud. Continúa EXACTAMENTE desde la última palabra, sin repetir nada, sin saludar ni comentar.`
  :p.segCount===0?`\nTAREA: escribe la PARTE 1: comienza la obra siguiendo el esquema, de forma completa y detallada.`
  :`\nTAREA: escribe la PARTE ${n}: la siguiente sección del esquema, completa y detallada. No repitas contenido previo. Si todo el esquema ya está cubierto, cierra la obra y añade [[FIN]].`;
 return t;
}
function trimOverlap(tail,t){if(!tail)return t;const max=Math.min(400,tail.length,t.length);for(let k=max;k>=25;k--){if(tail.endsWith(t.slice(0,k)))return t.slice(k)}return t}
function cleanSegment(p,raw,cont){
 let t=raw;const fin=/\[\[\s*FIN\s*\]\]/i.test(t);const m=t.match(/\[\[\s*RESUMEN\s*:([\s\S]*?)\]\]/i);const sum=m?m[1].trim():null;
 t=t.replace(/\[\[\s*RESUMEN[\s\S]*?\]\]/gi,'').replace(/\[\[\s*FIN\s*\]\]/gi,'').replace(/\[\[[^\]]*$/,'');
 if(cont)t=trimOverlap(p.tail,t);
 const hs=[],newFiles=[];
 if(p.kind==='code'){
  const parts=t.split(/(?=^### ARCHIVO:\s)/m);let out='';
  for(const part of parts){const mm=part.match(/^### ARCHIVO:\s*(.+)/);if(mm){const path=mm[1].trim();if(p.files.includes(path)||newFiles.includes(path))continue;newFiles.push(path)}out+=part}
  t=out;
 }else{
  const seen=new Set(p.seen);const ps=t.split(/(\n{2,})/);let out='';
  for(let i=0;i<ps.length;i+=2){const para=ps[i],sep=ps[i+1]||'';const n=norm(para);if(n.length>=80){const h=FH(n);if(seen.has(h))continue;seen.add(h);hs.push(h)}out+=para+sep}
  t=out;
 }
 return {text:t,fin,sum,hs,newFiles,rawLen:raw.length};
}
async function commit(p,raw,cont,finish,partial){
 const c=cleanSegment(p,raw,cont);
 const truncated=(finish==='length'||partial)&&!c.fin;
 let text=c.text;if(!cont&&p.segCount>0)text='\n\n'+text.trimStart();else if(p.segCount===0)text=text.trimStart();
 const added=c.text.trim().length;const ratio=added/Math.max(1,c.rawLen);
 if(added<5&&!c.fin){p.updated=Date.now();await DB.put('projects',p);return {added:0,finished:false,truncated:false}}
 const n=p.segCount+1;
 await DB.put('kv',{id:segKey(p.id,n),text,h:c.hs,files:c.newFiles});
 p.segCount=n;p.chars+=text.length;p.words+=(text.match(/\S+/g)||[]).length;p.tail=(p.tail+text).slice(-1800);
 p.seen=p.seen.concat(c.hs);p.files=p.files.concat(c.newFiles);if(c.sum)p.sums.push({n,t:c.sum});
 p.trunc=truncated;if(c.fin){p.status='done';p.trunc=false}p.updated=Date.now();
 await DB.put('projects',p);
 return {added:ratio<.15?0:added,finished:c.fin,truncated};
}
async function genSegment(p){
 const cont=!!p.trunc,n=p.segCount+1;let raw='';
 try{
  const r=await llm({system:projSystem(p),messages:[{role:'user',text:segPrompt(p,cont,n)}],maxTokens:TOKP[p.mode]||4096,signal:Run.ctrl.signal,noThink:true,
   onText:t=>{raw+=t;Run.live=raw;Orb.pulse();liveTick()}});
  return await commit(p,raw,cont,r.finish,false);
 }catch(e){
  if(raw.replace(/\[\[[^\]]*$/,'').trim().length>150)await commit(p,raw,cont,'length',true);
  throw e;
 }
}
async function makeOutline(p){
 Run.wait='Creando esquema del proyecto…';projUI();let t='';
 await llm({system:'Eres JARVIS AI, planificador editorial y técnico. Responde solo con el plan.',messages:[{role:'user',text:`Crea el plan maestro de este proyecto largo (${p.kind==='code'?'programa de software':'obra escrita'}).\n\nInstrucción:\n${p.brief}\nObjetivo/extensión: ${p.target||'la que el proyecto requiera'}\n\nIncluye: 1) esquema numerado completo de ${p.kind==='code'?'archivos y módulos con su responsabilidad y la tecnología elegida':'capítulos o secciones, una línea cada uno'}; 2) ${p.kind==='code'?'decisiones técnicas clave y dependencias':'personajes, conceptos o datos clave, y estilo/tono'}. Máximo 700 palabras. Solo el plan.`}],maxTokens:2000,signal:Run.ctrl.signal,noThink:true,onText:x=>{t+=x}});
 p.outline=t.trim();await DB.put('projects',p);
}
const retryable=e=>e.status===429||e.status>=500||e.isNet;
async function runProject(p,untilDone){
 if(Run.active){toast('Ya hay una generación en curso');return}
 if(!KEYS[S.provider]){toast('Configura primero la IA en Sistema → Ajustes de IA',4000);return}
 Run.active=true;Run.pause=false;Run.stop=false;Run.ctrl=new AbortController();Run.live='';p.status='running';p.lastError='';await DB.put('projects',p);setState('processing');projUI();
 try{if(S.wake&&navigator.wakeLock)Run.lock=await navigator.wakeLock.request('screen')}catch{}
 let parts=0,stall=0,fails=0;
 try{
  if(!p.outline)await makeOutline(p);
  while(!Run.pause&&!Run.stop){
   const lim=+S.maxParts;if(lim>0&&parts>=lim){p.lastError=`Se alcanzó el máximo de ${lim} partes por tanda (configurable en Ajustes). Pulsa Continuar para seguir.`;break}
   Run.wait=`Generando parte ${p.segCount+1}${p.trunc?' (continuación)':''}…`;Run.live='';projUI();
   let r;
   try{r=await genSegment(p);fails=0}
   catch(e){
    if(e.name==='AbortError')break;
    if(retryable(e)&&fails<3){const w=[5,15,45][fails++];for(let s=w;s>0;s--){Run.wait=`Error temporal (${e.message.slice(0,60)}). Reintento en ${s}s…`;projUI();await sleep(1000,Run.ctrl.signal)}continue}
    throw e;
   }
   parts++;
   if(r.finished){break}
   stall=r.added===0?stall+1:0;
   if(stall>=2){p.lastError='La IA empezó a repetir contenido o no aportó texto nuevo; detuve la generación. Revisa el esquema y pulsa Continuar.';break}
   if(!untilDone&&!r.truncated)break;
  }
  p.status=p.status==='done'?'done':'paused';
 }catch(e){
  if(e.name==='AbortError')p.status='paused';
  else{p.status='error';p.lastError=e.message}
 }
 if(p.lastError&&p.status==='paused'&&!Run.stop&&!Run.pause){}
 await DB.put('projects',p);
 Run.active=false;Run.wait='';try{if(Run.lock)Run.lock.release()}catch{}Run.lock=null;setState('idle');projUI();
 if(p.status==='done')toast('Proyecto completado: '+p.title,4000);
}

async function retryLast(p){
 if(p.segCount<1){toast('No hay partes que rehacer');return}
 const n=p.segCount;const s=await DB.get('kv',segKey(p.id,n));
 if(s){p.chars-=s.text.length;p.words-=(s.text.match(/\S+/g)||[]).length;const rm=new Set(s.h||[]);p.seen=p.seen.filter(h=>!rm.has(h));const rf=new Set(s.files||[]);p.files=p.files.filter(f=>!rf.has(f))}
 await DB.del('kv',segKey(p.id,n));p.segCount=n-1;p.sums=p.sums.filter(x=>x.n!==n);p.status='paused';p.trunc=false;p.lastError='';
 let tail='';for(let i=p.segCount;i>=1&&tail.length<1800;i--){const x=await DB.get('kv',segKey(p.id,i));if(x)tail=x.text+tail}p.tail=tail.slice(-1800);

}

function parseFiles(text){const out=[];const re=/^### ARCHIVO:\s*(.+)$/gm;const idx=[];let m;while((m=re.exec(text)))idx.push({path:m[1].trim(),at:m.index,end:re.lastIndex});
 idx.forEach((x,k)=>{const chunk=text.slice(x.end,k+1<idx.length?idx[k+1].at:text.length);const a=chunk.indexOf('```');if(a<0){out.push({path:x.path,code:chunk.trim()});return}const nl=chunk.indexOf('\n',a);const b=chunk.lastIndexOf('```');out.push({path:x.path,code:chunk.slice(nl+1,b>a?b:undefined).replace(/\n$/,'')})});return out}

function imgUrl(p,w,h,seed){const q=encodeURIComponent(p),k=KEYS.pollinations;
 return k?`https://gen.pollinations.ai/image/${q}?width=${w}&height=${h}&seed=${seed}&model=flux&nologo=true&key=${encodeURIComponent(k)}`

async function genImage(prompt,w,h,signal){
 let r;try{r=await fetch(imgUrl(prompt,w,h,Math.floor(Math.random()*1e6)),{signal})}catch(e){if(e.name==='AbortError')throw e;throw new Error('No se pudo conectar con el servicio de imágenes (sin red o bloqueado por el navegador).')}
 if(r.status===429)throw new Error('HTTP 429: límite del servicio gratuito de imágenes. Espera un minuto o usa una clave gratuita de enter.pollinations.ai.');
 if(!r.ok)throw new Error('El servicio de imágenes respondió HTTP '+r.status);
 const b=await r.blob();if(!/^image\//.test(b.type))throw new Error('La respuesta no fue una imagen.');return b}
async function genRetry(p,w,h,sig){for(let a=0;;a++){try{return await genImage(p.slice(0,800),w,h,sig)}catch(e){if(e.name==='AbortError'||a>=2||!/429|HTTP 5|conectar/.test(e.message))throw e;await sleep(8000*(a+1),sig)}}}

 await llm({system:'Eres guionista de videos cortos. Responde SOLO con JSON válido, sin markdown.',messages:[{role:'user',text:`Idea: ${idea}\nCrea ${n} escenas con este formato exacto: {"scenes":[{"prompt":"prompt de imagen en inglés, detallado y con estilo visual coherente con las demás escenas","caption":"texto corto en español para mostrar en pantalla (máx. 12 palabras)"}]}`}],maxTokens:1800,signal,noThink:true,onText:x=>{t+=x}});

function drawSlide(cx,bmp,cap,w,h,p){
 cx.globalAlpha=1;cx.fillStyle='#000';cx.fillRect(0,0,w,h);
 const sc=Math.max(w/bmp.width,h/bmp.height)*(1+.08*p),dw=bmp.width*sc,dh=bmp.height*sc,a=Math.max(0,Math.min(1,p*6,(1-p)*6));

 if(cap){const fs=Math.round(w/22);cx.font=`600 ${fs}px system-ui,sans-serif`;cx.textAlign='center';const L=wrapText(cx,cap,w*.84),lh=fs*1.25,bh=L.length*lh+fs,y0=h-bh-h*.06;cx.globalAlpha=a*.6;cx.fillStyle='#000';cx.fillRect(w*.04,y0,w*.92,bh);cx.globalAlpha=a;cx.fillStyle='#fff';L.forEach((l,k)=>cx.fillText(l,w/2,y0+fs*.95+k*lh))}

async function renderSlides(scenes,{w,h,secs,onProg,signal}){
 if(!window.MediaRecorder)throw new Error('Este navegador no puede grabar video.');
 const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 if(!mime)throw new Error('Este navegador no tiene un formato de video compatible.');
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
 const bm=await Promise.all(scenes.map(s=>createImageBitmap(s.blob)));
 const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:2500000}),chunks=[];
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(r=>{rec.onstop=r});
 const total=scenes.length*secs*1000;let aborted=false;
 drawSlide(cx,bm[0],scenes[0].caption,w,h,0);rec.start(500);const t0=performance.now();
 await new Promise(res=>{const f=now=>{if(signal&&signal.aborted){aborted=true;res();return}const el=now-t0;if(el>=total){res();return}
  const i=Math.min(scenes.length-1,Math.floor(el/(secs*1000)));drawSlide(cx,bm[i],scenes[i].caption,w,h,(el-i*secs*1000)/(secs*1000));if(onProg)onProg(el/total);requestAnimationFrame(f)};requestAnimationFrame(f)});
 rec.stop();await stopped;bm.forEach(x=>x.close&&x.close());

 else if(a.dataset.act==='speak')speak(m.text);

 else if(a.dataset.act==='retry'&&!BUSY){if(m.text){respond({cont:true})}else{CH.msgs.pop();respond({})}}
};
$('#lastReply').onclick=e=>{const cc=e.target.closest('[data-copycode]');if(cc)copyText(cc.closest('.code').querySelector('pre').textContent)};
$('#quick').innerHTML=['Explícame algo en 3 frases','Ayúdame a depurar código','Nuevo proyecto largo','Estado de la batería'].map((t,i)=>`<button data-q="${i}">${t}</button>`).join('');
$('#quick').onclick=e=>{const q=e.target.closest('[data-q]');if(!q)return;const i=+q.dataset.q;if(i===0){$('#inp').value='Explícame de forma clara y en 3 frases: ';$('#inp').focus()}else if(i===1){goTab('tools');openTool('code')}else if(i===2){goTab('tools');openTool('proy')}else{goTab('chat');send('batería')}};
window.addEventListener('online',()=>setState(STATE));window.addEventListener('offline',()=>setState(STATE));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkRem()});
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if($('#v-sys').classList.contains('on')&&!$('#sSave'))renderSys()};

/* ---------- Arranque ---------- */
(async function init(){
 $('#bMode').innerHTML=svg('mic');updateSend();applyMode();setState('idle');
 try{await DB.open()}catch(e){toast('No se pudo abrir el almacenamiento local: '+e.message,5000)}
 try{
  const m=await DB.get('kv','mem');MEM=m?m.items:[];const r=await DB.get('kv','reminders');REM=r?r.list:[];
  const ps=await DB.all('projects');for(const p of ps)if(p.status==='running'){p.status='paused';await DB.put('projects',p)}
  if(S.history){const cs=(await DB.all('chats')).sort((a,b)=>b.updated-a.updated);if(cs[0]&&cs[0].msgs.length)CH=cs[0]}
 }catch{}
 renderChat();loadChats();refreshChips();setInterval(checkRem,15000);
 try{const b=await navigator.getBattery();const f=()=>{AUTO_LP=b.level<=.2&&!b.charging;refreshChips()};f();b.onlevelchange=f;b.onchargingchange=f}catch{}
 if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
 const st=storedKeys();
 if(st.length){
  if(!window.isSecureContext||!crypto.subtle){toast('Contexto no seguro: no se pueden descifrar las claves',5000)}
  else for(let tries=0;tries<3;tries++){const pin=await modal({title:'Desbloquear JARVIS',body:'Introduce tu PIN para descifrar la clave de IA guardada.'+(tries?' <span style="color:var(--er)">PIN incorrecto.</span>':''),input:'password',okText:'Desbloquear',cancelText:'Omitir'});if(pin===null)break;if(await unlockKeys(pin))break}
  refreshChips();
 }
})();
</script>
